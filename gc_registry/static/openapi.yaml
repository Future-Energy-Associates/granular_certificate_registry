            "GranularCertificateBundle": {
                "properties": {
                    "created_at": {
                        "type": "string",
                        "format": "date-time",
                        "title": "Created At"
                    },
                    "issuance_id": {
                        "type": "string",
                        "title": "Issuance Id",
                        "description": "A unique identifier assigned to the GC Bundle at the time of issuance.\n        If the bundle is split through partial transfer or cancellation, this issuance ID\n        remains unchanged across each child GC Bundle."
                    },
                    "hash": {
                        "anyOf": [
                            {
                                "type": "string"
                            },
                            {
                                "type": "null"
                            }
                        ],
                        "title": "Hash",
                        "description": "A unique hash assigned to this bundle at the time of issuance,\n        formed from the sha256 of the bundle's properties and, if the result of a bundle\n        split, a nonce taken from the hash of the parent bundle."
                    },
                    "certificate_bundle_status": {
                        "$ref": "#/components/schemas/CertificateStatus",
                        "description": "One of: Active, Cancelled, Claimed, Expired, Withdrawn, Locked, Reserved."
                    },
                    "account_id": {
                        "type": "integer",
                        "title": "Account Id",
                        "description": "Each GC Bundle is assigned to a single unique Account e.g. production Device account or trading account"
                    },
                    "metadata_id": {
                        "type": "integer",
                        "title": "Metadata Id",
                        "description": "Reference to the associated issuance metadata"
                    },
                    "certificate_bundle_id_range_start": {
                        "type": "integer",
                        "title": "Certificate Bundle Id Range Start",
                        "description": "The individual Granular Certificates within this GC Bundle, each representing a\n                        contant volume of energy, generated within the production start and end time interval,\n                        is issued an ID in a format that can be represented sequentially and in a\n                        clearly ascending manner, displayed on the GC Bundle instance by start and end IDs indicating the minimum\n                        and maximum IDs contained within the Bundle, inclusive of both range end points and all integers\n                        within that range."
                    },
                    "certificate_bundle_id_range_end": {
                        "type": "integer",
                        "title": "Certificate Bundle Id Range End",
                        "description": "The start and end range IDs of GC Bundles may change as they are split and transferred between Accounts,\n                       or partially cancelled."
                    },
                    "bundle_quantity": {
                        "type": "integer",
                        "title": "Bundle Quantity",
                        "description": "The quantity of Granular Certificates within this GC Bundle, according to a\n                        standardised energy volume per Granular Certificate, rounded down to the nearest Wh. Equal to\n                        (certificate_bundle_id_range_end - certificate_bundle_id_range_start + 1)."
                    },
                    "beneficiary": {
                        "anyOf": [
                            {
                                "type": "string"
                            },
                            {
                                "type": "null"
                            }
                        ],
                        "title": "Beneficiary",
                        "description": "The Beneficiary entity that may make a claim on the attributes of the cancelled GC Bundles.\n                        If not specified, the Account holder is treated as the Beneficiary. This will default to the storage device in cases where cancelled for storage."
                    },
                    "energy_carrier": {
                        "$ref": "#/components/schemas/EnergyCarrierType",
