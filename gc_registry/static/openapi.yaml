                    },
                    "energy_source": {
                        "$ref": "#/components/schemas/EnergySourceType",
                        "description": "The fuel type used to generate the energy represented by the GC Bundle, for example: Solar, Wind, Biomass, Nuclear, Coal, Gas, Oil, Hydro."
                    },
                    "face_value": {
                        "type": "integer",
                        "title": "Face Value",
                        "description": "States the quantity of energy in Watt-hours (Wh) represented by each Granular Certificate within this GC Bundle."
                    },
                    "issuance_post_energy_carrier_conversion": {
                        "type": "boolean",
                        "title": "Issuance Post Energy Carrier Conversion",
                        "description": "Indicate whether this GC Bundle have been issued following an energy conversion event, for example in a power to hydrogen facility."
                    },
                    "emissions_factor_production_device": {
                        "anyOf": [
                            {
                                "type": "number"
                            },
                            {
                                "type": "null"
                            }
                        ],
                        "title": "Emissions Factor Production Device",
                        "description": "May indicate the emissions factor (kgCO2e/MWh) of the production Device at the datetime in which this GC Bundle was issued against."
                    },
                    "emissions_factor_source": {
                        "anyOf": [
                            {
                                "type": "string"
                            },
                            {
                                "type": "null"
                            }
                        ],
                        "title": "Emissions Factor Source",
                        "description": "Includes a reference to the calculation methodology of the production Device emissions factor."
                    },
                    "device_id": {
                        "type": "integer",
                        "title": "Device Id",
                        "description": "Each GC Bundle is associated with a single production Device."
                    },
                    "production_starting_interval": {
                        "type": "string",
                        "format": "date-time",
                        "title": "Production Starting Interval",
                        "description": "The datetime in UTC format indicating the start of the relevant production period.\n                        GC Bundles shall be issued over a maximum production period of one hour,\n                        under the assumption that the certificates represent an even distribution of power generation within that period."
                    },
                    "production_ending_interval": {
                        "type": "string",
                        "format": "date-time",
