        "/auth/api-key": {
            "post": {
                "tags": [
                    "Authentication"
                ],
                "summary": "Create Api Key",
                "description": "Create a new API key for the authenticated user.\n\nOnce a user has authenticated via the login endpoint with a username and password,\nthey can create an API key to use for API requests. As part of the request, the user\ncan specify an expiry date for the API key. If no expiry date is requested, then a default\nexpiry date is used, defined in the registry settings file.\n\nThe user can then use the API key in the request header in place of a username and password,\nusing the following format:\n\nAuthorization: API Key <key>\n\nThe user must also provide a descriptive name for the API key. This name is used to\nidentify the API key in the API key list endpoint. The user may also request to view\nall of their active API keys through the user/api-keys endpoint. The user can also\ndeactivate an API key by reference to the API key ID through the user/api-key/<api_key_id> endpoint.\n\nArgs:\n    api_key_request (ApiKeyRequest): The API key creation request.\n    current_user (User): The authenticated user.\n    write_session (Session): The database session to write to.\n    read_session (Session): The database session to read from.\n    esdb_client (EventStoreDBClient): The EventStoreDB client.\n\nReturns:\n    ApiKeyResponse: The created API key information including the key value.\n\nNote:\n    The API key value is only returned once during creation. Store it securely.",
                "operationId": "create_api_key_auth_api_key_post",
                "requestBody": {
                    "content": {
                        "application/json": {
                            "schema": {
                                "$ref": "#/components/schemas/ApiKeyRequest"
                            }
                        }
                    },
                    "required": true
                },
                "responses": {
                    "200": {
                        "description": "Successful Response",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/ApiKeyResponse"
                                }
                            }
                        }
                    },
                    "422": {
                        "description": "Validation Error",
                        "content": {
                            "application/json": {
                                "schema": {
                                    "$ref": "#/components/schemas/HTTPValidationError"
                                }
                            }
                        }
                    }
                },
                "security": [
                    {
                        "OAuth2PasswordBearer": []
                    },
                    {
                        "APIKeyHeader": []
                    }
                ]
            }
        },
        "/auth/api-keys": {
            "get": {
                "tags": [
                    "Authentication"
                ],
                "summary": "List Api Keys",
                "description": "List all API keys for the authenticated user.\n\nArgs:\n    current_user (User): The authenticated user.\n    read_session (Session): The database session to read from.\n\nReturns:\n    list[ApiKeyInfo]: List of the user's API keys (without the key values).",
